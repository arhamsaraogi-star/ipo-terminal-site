# Builds the encrypted vault + app shell and publishes ONLY those to the public site repo.
# Required secrets (private repo → Settings → Secrets and variables → Actions):
#   TERMINAL_PASSPHRASE  the terminal password (never stored anywhere else)
#   SITE_DEPLOY_TOKEN    fine-grained PAT with Contents: read/write on the public site repo only
# Required variable:
#   SITE_REPO            e.g. yourname/ipo-terminal-site
name: Deploy
on:
  push:
    branches: [main]
    paths: ["data/**", "rules/**", "schemas/**", "config/**", "src/**"]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Derive, validate, encrypt
        env:
          TERMINAL_PASSPHRASE: ${{ secrets.TERMINAL_PASSPHRASE }}
        run: PYTHONPATH=src python -m pipeline.build.compile --out src/web/public/vault.bin
      - name: Commit derived data (lock-ins) if changed
        run: |
          git config user.name "ipo-terminal-bot"
          git config user.email "ipo-terminal-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: derive lock-ins [skip ci]" && git push)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/web/package-lock.json }
      - name: Build app shell
        working-directory: src/web
        run: npm ci && npm test && npm run build
      - name: Refuse to publish plaintext
        run: |
          test -s src/web/dist/vault.bin
          head -c 5 src/web/dist/vault.bin | grep -q IPOV1
          ! grep -rIl --include='*.js' --include='*.html' -e '"company_id"' src/web/dist
          ! find src/web/dist -name '*.json' ! -name 'vault-meta.json' | grep .
          touch src/web/dist/.nojekyll
      - name: Publish to public site repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          external_repository: ${{ vars.SITE_REPO }}
          publish_branch: main
          publish_dir: src/web/dist
          force_orphan: true
          user_name: ipo-terminal-bot
          user_email: ipo-terminal-bot@users.noreply.github.com
          commit_message: "deploy"
