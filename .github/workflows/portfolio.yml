# "★ Add to portfolio" / "☆ Watch" buttons open a pre-filled issue; this applies it and redeploys.
name: Portfolio
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  apply:
    # Only the repository owner may change holdings.
    if: startsWith(github.event.issue.title, 'portfolio:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - id: apply
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$BODY" > /tmp/body.txt
          set +e
          MSG=$(PYTHONPATH=src python -m pipeline.portfolio --title "$TITLE" --body-file /tmp/body.txt); RC=$?
          set -e
          echo "$MSG"
          if [ $RC -ne 0 ]; then
            gh issue comment ${{ github.event.issue.number }} --body "$MSG"; echo "changed=false" >> $GITHUB_OUTPUT; exit 0
          fi
          git config user.name "ipo-terminal-bot"
          git config user.email "ipo-terminal-bot@users.noreply.github.com"
          git add data/portfolio
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; else
            git commit -m "portfolio: $MSG" && git push; echo "changed=true" >> $GITHUB_OUTPUT; fi
          gh issue close ${{ github.event.issue.number }} --comment "✅ $MSG — the terminal redeploys in ~2 minutes."
  deploy:
    needs: apply
    if: needs.apply.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
